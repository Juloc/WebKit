name: WebKit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate packages, templates and external consumer
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: webkit-packages
          path: artifacts/*.nupkg
